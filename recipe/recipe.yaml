schema_version: 1

context:
  name: rush
  version: "0.11.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/shenwei356/rush/archive/v${{ version }}.tar.gz
  sha256: 834bb6495e645b1983c48076c42eff3b0c6f769a7bbf6084b0de2ab711e861cc

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - rush --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A cross-platform command-line tool for executing jobs in parallel
  homepage: https://github.com/shenwei356/rush

extra:
  recipe-maintainers:
    - shenwei356
    - apcamargo
